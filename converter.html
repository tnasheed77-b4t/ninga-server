<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ninga - Converter</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Navigation Tabs */
    .nav-tabs {
      position: absolute;
      top: 30px;
      display: flex;
      gap: 30px;
    }
    .nav-tab {
      color: #666;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      padding-bottom: 5px;
      transition: color 0.2s;
    }
    .nav-tab:hover { color: #aaa; }
    .nav-tab.active {
      color: #FFFFFF;
      border-bottom: 2px solid #00e5ff;
    }

    /* Converter Box */
    .converter-box {
      padding: 40px;
      border: 1px solid #333;
      border-radius: 8px;
      background-color: transparent;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      width: 300px;
    }
    .converter-box:hover {
      background-color: #0a0a0a;
      border-color: #555;
    }
    .converter-title {
      color: #00e5ff;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .converter-subtext {
      color: #666666;
      font-size: 11px;
    }
    #convertInput { display: none; }
  </style>
</head>
<body>

  <!-- Navigation -->
  <div class="nav-tabs">
    <a href="index.html" class="nav-tab">BPM & Key</a>
    <a href="converter.html" class="nav-tab active">HQ Converter</a>
  </div>

  <!-- Converter App -->
  <div class="converter-box" id="converterBox">
    <div class="converter-title" id="converterTitle">Click to convert files to HQ Audio</div>
    <div class="converter-subtext" id="converterSubtext">Supports MP4, MOV, WAV, FLAC, and more</div>
  </div>

  <input type="file" id="convertInput" accept="audio/*,video/*">

  <script>
    const converterBox = document.getElementById('converterBox');
    const convertInput = document.getElementById('convertInput');
    const converterTitle = document.getElementById('converterTitle');
    const converterSubtext = document.getElementById('converterSubtext');

    converterBox.addEventListener('click', () => convertInput.click());

    convertInput.addEventListener('change', async () => {
      if (!convertInput.files.length) return;
      const file = convertInput.files[0];
      
      converterTitle.innerText = 'Converting... ⏳';
      converterTitle.style.color = '#FFFFFF';
      converterSubtext.innerText = 'This may take a moment.';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('https://ninga-audio-api.onrender.com/convert', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('Conversion failed');

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = downloadUrl;
        
        const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
        a.download = `${baseName}_HQ.mp3`;
        
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(downloadUrl);
        
        converterTitle.innerText = '✅ Download Complete!';
        converterTitle.style.color = '#00e5ff';
        converterSubtext.innerText = 'Click to convert another file.';

      } catch (error) {
        console.error(error);
        converterTitle.innerText = '❌ Error converting file';
        converterTitle.style.color = '#ff4444';
        converterSubtext.innerText = 'Check file format or size and try again.';
      }
      convertInput.value = ''; 
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
