<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ninga</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }

    /* 1. Analyzer Section */
    .analyzer-zone {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 40px;
      border-radius: 16px;
      border: 2px dashed transparent;
      transition: border 0.2s ease;
    }
    .analyzer-zone.drag-over {
      border: 2px dashed #444;
      background-color: #0a0a0a;
    }
    .logo-container img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }
    .logo-fallback { color: #FFFFFF; font-size: 16px; }
    .result-label {
      color: #FFFFFF;
      font-size: 14px;
      font-weight: bold;
      margin-top: 30px;
      text-align: center;
    }

    /* 2. Converter Section (Separated) */
    .converter-box {
      margin-top: 20px;
      padding: 12px 30px;
      border: 1px solid #222;
      border-radius: 6px;
      background-color: transparent;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .converter-box:hover {
      background-color: #0a0a0a;
      border-color: #333;
    }
    .converter-title {
      color: #00e5ff; /* Cyan accent matching screenshot */
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .converter-subtext {
      color: #666666;
      font-size: 10px;
    }

    /* Hidden Inputs */
    #analyzeInput, #convertInput { display: none; }
  </style>
</head>
<body>

  <!-- ANALYZER UI -->
  <div class="analyzer-zone" id="analyzerZone">
    <div class="logo-container">
      <img src="logo.png" alt="logo" onerror="this.style.display='none'; document.getElementById('fallback').style.display='block';">
      <span id="fallback" class="logo-fallback" style="display: none;">[ Logo Missing ]</span>
    </div>
    <div class="result-label" id="resultLabel">Drag & Drop an audio file here</div>
  </div>

  <!-- CONVERTER UI -->
  <div class="converter-box" id="converterBox">
    <div class="converter-title" id="converterTitle">Click to convert files to HQ Audio</div>
    <div class="converter-subtext" id="converterSubtext">Supports MP4, MOV, WAV, FLAC, and more</div>
  </div>

  <!-- ISOLATED INPUTS -->
  <input type="file" id="analyzeInput" accept=".wav,.mp3,.flac,.ogg,.m4a,audio/*">
  <input type="file" id="convertInput" accept="audio/*,video/*">

  <script>
    // --- 1. ANALYZER LOGIC ---
    const analyzerZone = document.getElementById('analyzerZone');
    const analyzeInput = document.getElementById('analyzeInput');
    const resultLabel = document.getElementById('resultLabel');
    const validAudioExts = ['.wav', '.mp3', '.flac', '.ogg', '.m4a'];

    analyzerZone.addEventListener('click', () => analyzeInput.click());

    analyzeInput.addEventListener('change', () => {
      if (analyzeInput.files.length) handleAnalyzeFile(analyzeInput.files[0]);
    });

    analyzerZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      analyzerZone.classList.add('drag-over');
    });

    ['dragleave', 'dragend'].forEach(type => {
      analyzerZone.addEventListener(type, () => analyzerZone.classList.remove('drag-over'));
    });

    analyzerZone.addEventListener('drop', (e) => {
      e.preventDefault();
      analyzerZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) handleAnalyzeFile(e.dataTransfer.files[0]);
    });

    async function handleAnalyzeFile(file) {
      const fileName = file.name.toLowerCase();
      const isValid = validAudioExts.some(ext => fileName.endsWith(ext));

      if (!isValid) {
        resultLabel.innerText = 'Unsupported file format!';
        return;
      }

      resultLabel.innerText = 'Extracting first 15s...';

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const sampleRate = audioBuffer.sampleRate;
        const durationSamples = Math.min(15 * sampleRate, audioBuffer.length);
        
        const offlineCtx = new OfflineAudioContext(1, durationSamples, 22050);
        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineCtx.destination);
        source.start(0, 0, durationSamples / sampleRate);
        
        const renderedBuffer = await offlineCtx.startRendering();
        const wavBlob = audioBufferToWavBlob(renderedBuffer);

        resultLabel.innerText = 'Analyzing audio...';
        
        const formData = new FormData();
        formData.append('file', wavBlob, 'snippet.wav');

        const response = await fetch('https://ninga-audio-api.onrender.com/analyze', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('Server error');
        const data = await response.json();
        
        resultLabel.innerText = data.key ? `${data.bpm} | ${data.key}` : `${data.bpm}`;
      } catch (err) {
        console.error(err);
        resultLabel.innerText = 'Error processing file';
      }
      analyzeInput.value = ''; // Reset
    }

    function audioBufferToWavBlob(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], sample, offset = 0, pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
      setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
      setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true); pos += 2;
        }
        offset++;
      }
      return new Blob([out.buffer], { type: 'audio/wav' });
    }

    // --- 2. CONVERTER LOGIC ---
    const converterBox = document.getElementById('converterBox');
    const convertInput = document.getElementById('convertInput');
    const converterTitle = document.getElementById('converterTitle');
    const converterSubtext = document.getElementById('converterSubtext');

    converterBox.addEventListener('click', () => convertInput.click());

    convertInput.addEventListener('change', async () => {
      if (!convertInput.files.length) return;
      const file = convertInput.files[0];
      
      converterTitle.innerText = 'Converting... ⏳';
      converterTitle.style.color = '#FFFFFF';
      converterSubtext.innerText = 'This may take a moment.';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('https://ninga-audio-api.onrender.com/convert', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('Conversion failed');

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = downloadUrl;
        
        const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
        a.download = `${baseName}_HQ.mp3`;
        
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(downloadUrl);
        
        converterTitle.innerText = '✅ Download Complete!';
        converterTitle.style.color = '#00e5ff';
        converterSubtext.innerText = 'Click to convert another file.';

      } catch (error) {
        console.error(error);
        converterTitle.innerText = '❌ Error converting file';
        converterTitle.style.color = '#ff4444';
        converterSubtext.innerText = 'Check file format or size and try again.';
      }
      convertInput.value = ''; // Reset
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
