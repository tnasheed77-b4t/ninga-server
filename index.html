<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ninga</title>

  <!-- Android / PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="logo.png">

  <!-- iOS Home Screen Icons & App Mode -->
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ninga">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .app-container {
      width: 400px;
      height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      padding: 20px;
      position: relative;
    }
    .logo-container {
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo-container img {
      max-width: 200px;
      max-height: 200px;
      object-fit: contain;
    }
    .logo-fallback { color: #FFFFFF; font-size: 16px; }
    
    .result-label {
      color: #FFFFFF;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      line-height: 1.4;
      word-break: break-word;
      min-height: 25px;
    }

    .app-container.drag-over {
      outline: 2px dashed #ffffff;
      border-radius: 12px;
    }

    /* Minimal Toggle Feature */
    .toggle-container {
      display: flex;
      gap: 10px;
      margin-top: 40px;
      background-color: #111;
      padding: 6px;
      border-radius: 30px;
      z-index: 10;
    }
    .toggle-btn {
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      color: #888;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .toggle-btn:hover {
      color: #ccc;
    }
    .toggle-btn.active {
      background-color: #FFFFFF;
      color: #000000;
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="app-container" id="dropZone">
    <div class="logo-container">
      <img src="logo.png" alt="logo" onerror="this.style.display='none'; document.getElementById('fallback').style.display='block';">
      <span id="fallback" class="logo-fallback" style="display: none;">[ Logo Missing ]</span>
    </div>

    <div class="result-label" id="resultLabel">
      Drag & Drop an audio file here
    </div>

    <!-- Toggle Feature Below Drag & Drop -->
    <div class="toggle-container" id="toggleContainer">
      <div class="toggle-btn active" id="modeBpm">BPM & Key</div>
      <div class="toggle-btn" id="modeConvert">MP4 to MP3</div>
    </div>

    <input type="file" id="fileInput" accept=".wav,.mp3,.flac,.ogg,.m4a,audio/*">
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const resultLabel = document.getElementById('resultLabel');
    
    // Toggle Elements
    const modeBpm = document.getElementById('modeBpm');
    const modeConvert = document.getElementById('modeConvert');
    let currentMode = 'bpm';

    // Handle Toggle Switching
    modeBpm.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMode = 'bpm';
      modeBpm.classList.add('active');
      modeConvert.classList.remove('active');
      resultLabel.innerText = 'Drag & Drop an audio file here';
      fileInput.setAttribute('accept', '.wav,.mp3,.flac,.ogg,.m4a,audio/*');
    });

    modeConvert.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMode = 'convert';
      modeConvert.classList.add('active');
      modeBpm.classList.remove('active');
      resultLabel.innerText = 'Drag & Drop an MP4 to convert to MP3';
      fileInput.setAttribute('accept', 'video/mp4,video/mov,audio/*,video/*');
    });

    // File Input Triggers
    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    ['dragleave', 'dragend'].forEach(eventType => {
      dropZone.addEventListener(eventType, () => dropZone.classList.remove('drag-over'));
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    // Main Routing Function
    async function handleFile(file) {
      if (currentMode === 'bpm') {
        await runAnalyzer(file);
      } else if (currentMode === 'convert') {
        await runConverter(file);
      }
      fileInput.value = '';
    }

    // --- 1. BPM & KEY ANALYZER FUNCTION ---
    async function runAnalyzer(file) {
      const validExtensions = ['.wav', '.mp3', '.flac', '.ogg', '.m4a'];
      const fileName = file.name.toLowerCase();
      const isValid = validExtensions.some(ext => fileName.endsWith(ext));

      if (!isValid) {
        resultLabel.innerText = 'Unsupported audio format!';
        return;
      }

      resultLabel.innerText = 'Extracting first 15s...';

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const sampleRate = audioBuffer.sampleRate;
        const durationSamples = Math.min(15 * sampleRate, audioBuffer.length);
        
        const offlineCtx = new OfflineAudioContext(1, durationSamples, 22050);
        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineCtx.destination);
        source.start(0, 0, durationSamples / sampleRate);
        
        const renderedBuffer = await offlineCtx.startRendering();
        const wavBlob = audioBufferToWavBlob(renderedBuffer);

        resultLabel.innerText = 'Analyzing audio...';
        
        const formData = new FormData();
        formData.append('file', wavBlob, 'snippet.wav');

        const response = await fetch('https://ninga-audio-api.onrender.com/analyze', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('Server returned an error');

        const data = await response.json();
        resultLabel.innerText = data.key ? `${data.bpm}  |  ${data.key}` : `${data.bpm}`;
        
      } catch (err) {
        console.error(err);
        resultLabel.innerText = 'Error processing file';
      }
    }

    // --- 2. MP4 TO MP3 CONVERTER FUNCTION ---
    async function runConverter(file) {
      // Safety Check: Render blocks files over 100MB. 
      // We use 95MB to leave room for the FormData network headers.
      const maxSize = 95 * 1024 * 1024; 
      if (file.size > maxSize) {
        resultLabel.innerText = '❌ File too large (Max 95MB)';
        setTimeout(() => {
          if (currentMode === 'convert') {
             resultLabel.innerText = 'Drag & Drop an MP4 to convert to MP3';
          }
        }, 4000);
        return;
      }

      resultLabel.innerText = 'Preparing file... ⏳';

      try {
        // BUG FIX: Mobile browsers often drop fetch requests containing raw mobile File objects.
        // We read it into a generic Blob in browser memory first (just like the Analyzer does).
        const fileBuffer = await file.arrayBuffer();
        const safeBlob = new Blob([fileBuffer], { type: file.type || 'application/octet-stream' });
        const safeName = file.name || 'mobile_upload.mp4';

        resultLabel.innerText = 'Uploading & Converting... ⏳';

        const formData = new FormData();
        // Explicitly attach the safe name so the Python backend doesn't crash
        formData.append('file', safeBlob, safeName);
        formData.append('target_format', 'mp3'); 

        const response = await fetch('https://ninga-audio-api.onrender.com/convert', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('Server rejected the conversion.');

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = downloadUrl;
        
        const baseName = safeName.substring(0, safeName.lastIndexOf('.')) || safeName;
        a.download = `${baseName}_HQ.mp3`;
        
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(downloadUrl);
        
        resultLabel.innerText = '✅ Download Complete!';
        
        setTimeout(() => {
          if (currentMode === 'convert') {
             resultLabel.innerText = 'Drag & Drop an MP4 to convert to MP3';
          }
        }, 3000);

      } catch (error) {
        console.error(error);
        // This will now print the exact system error text to your screen if it fails
        resultLabel.innerText = '❌ ' + (error.message || 'Error converting file');
      }
    }

    // WAV Blob helper
    function audioBufferToWavBlob(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], sample, offset = 0, pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
      setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
      setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true); pos += 2;
        }
        offset++;
      }
      return new Blob([out.buffer], { type: 'audio/wav' });
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
