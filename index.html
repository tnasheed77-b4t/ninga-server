<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ninga</title>

  <!-- Android / PWA Manifest & Theme (Renamed to pwa.webmanifest so manifest.json can be used for the Chrome Extension) -->
  <link rel="manifest" href="pwa.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="logo.png">

  <!-- iOS Home Screen Icons & App Mode -->
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ninga">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-width: 400px;
      min-height: 540px;
    }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 20px 0;
    }
    .app-container {
      width: 400px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      padding: 20px;
      position: relative;
    }
    .logo-container {
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }
    .logo-container img {
      max-width: 180px;
      max-height: 180px;
      object-fit: contain;
    }
    .logo-fallback { color: #FFFFFF; font-size: 16px; }
    
    /* Paste Link Here Input (Matches your previous result-label look) */
    .paste-input {
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      max-width: 340px;
      margin-top: 15px;
      line-height: 1.4;
      min-height: 25px;
    }
    .paste-input::placeholder {
      color: #FFFFFF;
      opacity: 1;
    }

    .result-label {
      color: #FFFFFF;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      line-height: 1.4;
      word-break: break-word;
      min-height: 25px;
    }

    .app-container.drag-over {
      outline: 2px dashed #ffffff;
      border-radius: 12px;
    }

    /* WAV / MP3 Toggle Feature */
    .toggle-container {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      background-color: #111;
      padding: 6px;
      border-radius: 30px;
      z-index: 10;
    }
    .toggle-btn {
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      color: #888;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .toggle-btn:hover {
      color: #ccc;
    }
    .toggle-btn.active {
      background-color: #FFFFFF;
      color: #000000;
    }

    /* Ask Ninga Search Section */
    .search-container {
      width: 100%;
      max-width: 320px;
      margin-top: 30px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .search-input-row {
      display: flex;
      width: 100%;
      background-color: #111;
      padding: 6px;
      border-radius: 30px;
    }
    #searchInput {
      flex: 1;
      background-color: transparent;
      border: none;
      color: #FFFFFF;
      padding: 8px 16px;
      font-size: 12px;
      outline: none;
      font-weight: bold;
    }
    #searchInput::placeholder {
      color: #666;
      font-weight: normal;
    }
    #searchBtn {
      background-color: #FFFFFF;
      color: #000000;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #searchBtn:hover {
      background-color: #ccc;
    }
    #searchResult {
      margin-top: 15px;
      font-size: 13px;
      color: #bbb;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: center;
      padding: 0 10px;
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="app-container" id="dropZone">
    <div class="logo-container">
      <img src="logo.png" alt="logo" id="logoImg">
      <span id="fallback" class="logo-fallback" style="display: none;">[ Logo Missing ]</span>
    </div>

    <!-- Paste Link Input & Status/BPM-Key Display -->
    <input type="text" id="urlInput" class="paste-input" placeholder="Paste Link Here" autocomplete="off">
    <div class="result-label" id="resultLabel" style="display: none;"></div>

    <!-- Format Toggle (WAV or MP3) -->
    <div class="toggle-container" id="toggleContainer">
      <div class="toggle-btn active" id="modeWav">WAV</div>
      <div class="toggle-btn" id="modeMp3">MP3</div>
    </div>

    <!-- Ask Ninga Feature -->
    <div class="search-container" id="searchContainer">
      <div class="search-input-row">
        <input type="text" id="searchInput" placeholder="Ask Ninga...">
        <button id="searchBtn" type="button">Search</button>
      </div>
      <div id="searchResult"></div>
    </div>

    <input type="file" id="fileInput" accept=".wav,.mp3,.flac,.ogg,.m4a,.mp4,.mov,audio/*,video/*">
  </div>

  <script src="app.js"></script>
</body>
</html>
