<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ninga</title>
  <style>
    /* Match PyQt6 solid black background & layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Main Container (400x500 like the PyQt window) */
    .app-container {
      width: 400px;
      height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      padding: 20px;
    }

    /* Logo Styling */
    .logo-container {
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo-container img {
      max-width: 200px;
      max-height: 200px;
      object-fit: contain;
    }
    .logo-fallback {
      color: #FFFFFF;
      font-size: 16px;
    }

    /* Text Label (Matches your result_label styles) */
    .result-label {
      color: #FFFFFF;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      line-height: 1.4;
      word-break: break-word;
    }

    /* Drag hover effect */
    .app-container.drag-over {
      outline: 2px dashed #ffffff;
      border-radius: 12px;
    }

    /* Hidden file input */
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container" id="dropZone">
    <!-- Logo Display -->
    <div class="logo-container">
      <img src="logo.png" alt="logo" onerror="this.style.display='none'; document.getElementById('fallback').style.display='block';">
      <span id="fallback" class="logo-fallback" style="display: none;">[ Logo Missing ]</span>
    </div>

    <!-- Status / Results Display -->
    <div class="result-label" id="resultLabel">
      Drag &amp; Drop an audio file here
    </div>

    <!-- Hidden File Picker -->
    <input type="file" id="fileInput" accept=".wav,.mp3,.flac,.ogg,.m4a,audio/*">
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const resultLabel = document.getElementById('resultLabel');

    // Supported extensions from your Python script
    const validExtensions = ['.wav', '.mp3', '.flac', '.ogg', '.m4a'];

    // Click anywhere in app box to open file selector
    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        handleFile(fileInput.files[0]);
      }
    });

    // Drag & Drop event handlers
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    ['dragleave', 'dragend'].forEach(eventType => {
      dropZone.addEventListener(eventType, () => {
        dropZone.classList.remove('drag-over');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');

      if (e.dataTransfer.files.length) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // Validate and process selected file
    function handleFile(file) {
      const fileName = file.name.toLowerCase();
      const isValid = validExtensions.some(ext => fileName.endsWith(ext));

      if (!isValid) {
        resultLabel.innerText = 'Unsupported file format!';
        return;
      }

      resultLabel.innerText = 'Analyzing audio...';
      uploadAndAnalyze(file);
    }

    // Send audio file to your live Render API
    async function uploadAndAnalyze(file) {
      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('https://ninga-audio-api.onrender.com/analyze', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('Server returned an error');
        }

        const data = await response.json();

        // Format result like your Python code: "128 BPM  |  C Major"
        if (data.key) {
          resultLabel.innerText = `${data.bpm}  |  ${data.key}`;
        } else {
          resultLabel.innerText = `${data.bpm}`;
        }
      } catch (error) {
        console.error(error);
        resultLabel.innerText = 'Error processing file';
      }
    }
  </script>
</body>
</html>
