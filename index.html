<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ninga</title>

  <!-- Android / PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="logo.png">

  <!-- iOS Home Screen Icons & App Mode -->
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ninga">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .app-container {
      width: 400px;
      height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      padding: 20px;
    }
    .logo-container {
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo-container img {
      max-width: 200px;
      max-height: 200px;
      object-fit: contain;
    }
    .logo-fallback { color: #FFFFFF; font-size: 16px; }
    .result-label {
      color: #FFFFFF;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      line-height: 1.4;
      word-break: break-word;
    }
    .app-container.drag-over {
      outline: 2px dashed #ffffff;
      border-radius: 12px;
    }
    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="app-container" id="dropZone">
    <div class="logo-container">
      <img src="logo.png" alt="logo" onerror="this.style.display='none'; document.getElementById('fallback').style.display='block';">
      <span id="fallback" class="logo-fallback" style="display: none;">[ Logo Missing ]</span>
    </div>

    <div class="result-label" id="resultLabel">
      Drag &amp; Drop an audio file here
    </div>

    <input type="file" id="fileInput" accept=".wav,.mp3,.flac,.ogg,.m4a,audio/*">
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const resultLabel = document.getElementById('resultLabel');
    const validExtensions = ['.wav', '.mp3', '.flac', '.ogg', '.m4a'];

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    ['dragleave', 'dragend'].forEach(eventType => {
      dropZone.addEventListener(eventType, () => dropZone.classList.remove('drag-over'));
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    async function handleFile(file) {
      const fileName = file.name.toLowerCase();
      const isValid = validExtensions.some(ext => fileName.endsWith(ext));

      if (!isValid) {
        resultLabel.innerText = 'Unsupported file format!';
        return;
      }

      resultLabel.innerText = 'Extracting first 15s...';

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        // Slice strictly from 0 to 15 seconds
        const sampleRate = audioBuffer.sampleRate;
        const startOffset = 0;
        const durationSamples = Math.min(15 * sampleRate, audioBuffer.length);
        
        const offlineCtx = new OfflineAudioContext(1, durationSamples, 22050);
        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineCtx.destination);
        source.start(0, 0, durationSamples / sampleRate);
        
        const renderedBuffer = await offlineCtx.startRendering();
        const wavBlob = audioBufferToWavBlob(renderedBuffer);

        resultLabel.innerText = 'Analyzing audio...';
        uploadAndAnalyze(wavBlob);
      } catch (err) {
        console.error(err);
        resultLabel.innerText = 'Error preparing file';
      }
    }

    async function uploadAndAnalyze(blob) {
      const formData = new FormData();
      formData.append('file', blob, 'snippet.wav');

      try {
        const response = await fetch('https://ninga-audio-api.onrender.com/analyze', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('Server returned an error');
        }

        const data = await response.json();

        if (data.key) {
          resultLabel.innerText = `${data.bpm}  |  ${data.key}`;
        } else {
          resultLabel.innerText = `${data.bpm}`;
        }
      } catch (error) {
        console.error(error);
        resultLabel.innerText = 'Error processing file';
      }
    }

    function audioBufferToWavBlob(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], sample, offset = 0, pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952);
      setUint32(length - 8);
      setUint32(0x45564157);
      setUint32(0x20746d66);
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(buffer.sampleRate);
      setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164);
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out.buffer], { type: 'audio/wav' });
    }
  </script>
</body>
</html>
