<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ninga</title>
  <!-- Load Essentia.js WebAssembly Audio Engine -->
  <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia-wasm.web.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia.js-core.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .app-container {
      width: 400px;
      height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      padding: 20px;
    }
    .logo-container {
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo-container img {
      max-width: 200px;
      max-height: 200px;
      object-fit: contain;
    }
    .logo-fallback { color: #FFFFFF; font-size: 16px; }
    .result-label {
      color: #FFFFFF;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      line-height: 1.4;
      word-break: break-word;
    }
    .app-container.drag-over {
      outline: 2px dashed #ffffff;
      border-radius: 12px;
    }
    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="app-container" id="dropZone">
    <div class="logo-container">
      <img src="logo.png" alt="logo" onerror="this.style.display='none'; document.getElementById('fallback').style.display='block';">
      <span id="fallback" class="logo-fallback" style="display: none;">[ Logo Missing ]</span>
    </div>

    <div class="result-label" id="resultLabel">
      Drag &amp; Drop an audio file here
    </div>

    <input type="file" id="fileInput" accept=".wav,.mp3,.flac,.ogg,.m4a,audio/*">
  </div>

  <script>
    let essentia = null;

    // Initialize WebAssembly Engine
    EssentiaWASM().then(function(WasmModule) {
      essentia = new Essentia(WasmModule);
    });

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const resultLabel = document.getElementById('resultLabel');
    const validExtensions = ['.wav', '.mp3', '.flac', '.ogg', '.m4a'];

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    ['dragleave', 'dragend'].forEach(evt => {
      dropZone.addEventListener(evt, () => dropZone.classList.remove('drag-over'));
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    async function handleFile(file) {
      const fileName = file.name.toLowerCase();
      const isValid = validExtensions.some(ext => fileName.endsWith(ext));

      if (!isValid) {
        resultLabel.innerText = 'Unsupported file format!';
        return;
      }

      if (!essentia) {
        resultLabel.innerText = 'Engine loading, try again in a second...';
        return;
      }

      resultLabel.innerText = 'Analyzing audio...';

      try {
        // Step 1: Decode Audio Buffer locally in browser
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await file.arrayBuffer();
        const decodedAudio = await audioCtx.decodeAudioData(arrayBuffer);

        // Step 2: Convert audio channels to Mono Vector for Essentia
        const channelData = decodedAudio.getChannelData(0);
        const audioVector = essentia.arrayToVector(channelData);

        // Step 3: Fast BPM Detection
        const bpmResult = essentia.PercivalBpmEstimator(
          audioVector,
          decodedAudio.sampleRate,
          2048, 1024, 128, 0.1, 200, 50, 1024
        );

        // Step 4: Fast Key Detection
        const keyResult = essentia.KeyExtractor(
          audioVector,
          true, 4096, 4096, 12, 3500, 60, 25, 0.2, 'profileHPCP', 4410, decodedAudio.sampleRate
        );

        const roundedBpm = Math.round(bpmResult.bpm);
        const detectedKey = `${keyResult.key} ${keyResult.scale}`;

        resultLabel.innerText = `${roundedBpm} BPM  |  ${detectedKey}`;
      } catch (err) {
        console.error(err);
        resultLabel.innerText = 'Error processing file locally';
      }
    }
  </script>
</body>
</html>
